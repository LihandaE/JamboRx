<h1>Your Cart</h1>
<div id="cart-container"></div>
<h2>Total: <span id="total"></span></h2>

<script>
let cart = JSON.parse(localStorage.getItem("jrx_cart") || "[]");

function loadCart() {
    const cont = document.getElementById("cart-container");
    cont.innerHTML = "";

    let total = 0;

    cart.forEach((item, index) => {
        total += item.price * item.qty;

        cont.innerHTML += `
            <div class="cart-item">
                <img src="${item.img}">
                <p>${item.name}</p>
                <p>KES ${item.price} x ${item.qty}</p>
                <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
            </div>
        `;
    });

    document.getElementById("total").innerText = "KES " + total;
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem("jrx_cart", JSON.stringify(cart));
    loadCart();
}

loadCart();
</script>
